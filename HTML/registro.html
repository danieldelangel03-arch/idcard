<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro</title>
    </head>
    <body>
        <header>
            <h1>Registracion del cuenta Transformers</h1>
        </header>
        <form action="/idcard/HTML/login.html">
            <label for="nombre">Nombre</label>
            <input type="text" id="registronombre" name="nombre" required><br><br>
            <label for="correo">Correo</label>
            <input type="text" id="registrocorreo" name="correo" required><br><br>
            <label for="contrasena">Contrasena</label>
            <input type="text" id="registrocontrasena" name="contrasena" required><br><br>
            <label for="telefono">Numero de telefono</label>
            <input type="text" id="registrotelefono" name="telefono" required><br><br>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
